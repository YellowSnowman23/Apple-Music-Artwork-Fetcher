[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-music-artwork-embedder"
version = "2.1.4"
description = "Accuracy-first Apple mzstatic artwork matching and embedding"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["apple-music", "artwork", "metadata", "mutagen", "mzstatic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "mutagen>=1.47,<2",
  "Pillow>=12.3.0,<13",
  "requests>=2.34.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
apple-artwork = "apple_music_artwork.cli:main"

[project.urls]
Repository = "https://github.com/YellowSnowman23/Apple-Music-Artwork-Fetcher"

[tool.setuptools]
py-modules = ["apple_artwork"]

[tool.setuptools.packages.find]
include = ["apple_music_artwork*"]

[tool.check-wheel-contents]
toplevel = ["apple_artwork.py", "apple_music_artwork"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
